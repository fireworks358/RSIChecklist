<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages serves this file for any URL it doesn't recognize as a
      // real static file — which is every client-side route in this SPA
      // (e.g. /RSIChecklist/category/adult). That happens whenever a
      // navigation hits the network directly instead of being handled by
      // React Router: typing a URL, refreshing, or iOS Safari's swipe-back
      // gesture reloading a history entry it evicted from memory.
      //
      // Encode the intended path into a query string and redirect to the
      // real index.html, which restores it (see the matching script there)
      // before React Router reads the URL.
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
